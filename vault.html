/* ---------- crypto + serialization (no compression => no zip bombs) ---------- */

    let p;try{p=dec.decode(b.subarray(o,o+pl))}catch{bad()}o+=pl;
    const sz=dv.getUint32(o);o+=4;tot+=sz;if(tot>MAXV)bad();e.push([p,sz]);
  }
  if(o+tot!==b.length)bad();               // sizes must account for every byte exactly
  const files=new Map(),dirs=new Set(),seen=new Set();
  for(const[p,sz]of e){

    if(!okPath(q)||(d&&sz)||seen.has(q))bad();seen.add(q);

  }

async function unseal(buf,pw){

  const it=new DataView(buf.buffer,buf.byteOffset).getUint32(5);if(it<200000||it>10000000)throw Error('Unsupported KDF parameters');

  try{return{...des(pt),it}}finally{pt.fill(0)}

async function seal(){

/* ---------- prompt / menu ---------- */
function ask(title,o={}){return new Promise(res=>{P={title,val:o.value||'',sec:!!o.secret,show:false,yn:!!o.yn,items:o.items,res};drawP();updKb()})}

function drawP(){

    if(P.sec)h+=`<div class="b" data-m="s">${P.show?'Hide':'Show'}</div>`;h+='<div class="b p" data-m="y">OK</div><div class="b" data-m="x">Cancel</div>'}

/* ---------- editor ---------- */
const LG={js:'c',mjs:'c',ts:'c',jsx:'c',tsx:'c',c:'c',h:'c',cpp:'c',cs:'c',java:'c',go:'c',rs:'c',swift:'c',kt:'c',php:'c',css:'c',json:'c',py:'p',sh:'p',rb:'p',yml:'p',yaml:'p',toml:'p',conf:'p',ini:'p',md:'m',html:'h',htm:'h',xml:'h',svg:'h'};

const sel=()=>E.anc==null||E.anc===E.cur?null:[Math.min(E.anc,E.cur),Math.max(E.anc,E.cur)];

function draw(){
  const pe=$('#pe');pe.classList.toggle('noe',!E);
  if(!E){$('#eh').innerHTML='<span class="mu">No file open</span>';$('#ed').innerHTML='<span class="mu">Open a text file from the Files tab.</span>';return}
  $('#eh').innerHTML=esc(E.path)+(E.dirty?' <span class="wr">●</span>':'')+' <span class="mu">'+fmt(enc.encode(E.text).length)+'</span>';
  $('#bsel').classList.toggle('on',E.ext);
  const t=E.text,r=sel();let out='',dr=0;const cur=`<span class="cur" data-o="${E.cur}"></span>`;
  for(const[s,e,c]of hl(t,lang())){
    const pts=[...new Set([s,e,...[r&&r[0],r&&r[1],E.cur].filter(x=>x!=null&&x>s&&x<e)])].sort((a,b)=>a-b);
    for(let i=0;i<pts.length-1;i++){
      const x=pts[i],y=pts[i+1];if(x===E.cur&&!dr){out+=cur;dr=1}
      out+=`<span class="${c}${r&&x>=r[0]&&y<=r[1]?' sl':''}" data-o="${x}">${esc(t.slice(x,y))}</span>`;
    }
  }
  if(!dr)out+=cur;$('#ed').innerHTML=out+'\u200b';
  $('#q').innerHTML=Q.length?Q.map((s,i)=>`<span class="chip${i===qi?' on':''}" data-q="${i}">${esc(s.replace(/\s+/g,' ').slice(0,24))}<b data-x="${i}">×</b></span>`).join(''):'<span class="mu">Clipboard queue empty — stays inside this page, never the OS clipboard</span>';
  const c=$('#ed .cur'),w=$('#edw');
  if(c){const a=c.getBoundingClientRect(),b=w.getBoundingClientRect();if(a.top<b.top)w.scrollTop-=b.top-a.top+10;else if(a.bottom>b.bottom)w.scrollTop+=a.bottom-b.bottom+10}
}
$('#edw').addEventListener('click',e=>{
  if(!E)return;let i=at(e.clientX,e.clientY);if(i==null)i=E.text.length;
  if(E.ext){if(E.anc==null)E.anc=E.cur}else E.anc=null;
  E.cur=i;E.kb=true;updKb();draw();
});
$('#q').addEventListener('click',e=>{
  const x=e.target.closest('[data-x]'),q=e.target.closest('[data-q]');
  if(x){Q.splice(+x.dataset.x,1);qi=0}else if(q)qi=+q.dataset.q;draw();
});
$('#tb').addEventListener('click',async e=>{
  const a=e.target.closest('[data-a]');if(!a||!E)return;const k=a.dataset.a;
  if('lrudhetb'.includes(k)&&k.length===1)return mv(k);
  if(k==='save')saveEd();
  else if(k==='kb'){E.kb=!E.kb;updKb()}
  else if(k==='undo'){const u=E.undo.pop();if(u){E.text=u[0];E.cur=u[1];E.anc=null;E.dirty=true;draw()}}
  else if(k==='sel'){E.ext=!E.ext;if(E.ext&&E.anc==null)E.anc=E.cur;draw()}
  else if(k==='all'){E.anc=0;E.cur=E.text.length;draw()}
  else if(k==='copy')cc(0);else if(k==='cut')cc(1);
  else if(k==='paste'){if(!Q.length)toast('Queue is empty');else ET.ins(Q[qi])}
  else if(k==='close'){if(E.dirty&&!await ask('Discard unsaved edits?',{yn:1}))return;E=null;setTab('f')}
});

/* ---------- files tab ---------- */
function drawF(){
  const el=$('#pf');if(!V){el.innerHTML='<p class="mu">No vault open. Create or open one in the Vault tab.</p>';return}
  const pre=cwd?cwd+'/':'',dirs=[],fl=[];
  for(const d of V.dirs)if(d.startsWith(pre)&&!d.slice(pre.length).includes('/'))dirs.push(d.slice(pre.length));
  for(const[p,b]of V.files)if(p.startsWith(pre)&&!p.slice(pre.length).includes('/'))fl.push([p.slice(pre.length),b.length]);
  dirs.sort((a,b)=>a.localeCompare(b));fl.sort((a,b)=>a[0].localeCompare(b[0]));
  const cr=cwd?cwd.split('/'):[];
  let h=`<div class="crumb"><a data-d="">${esc(V.name)}</a>`+cr.map((c,i)=>` / <a data-d="${esc(cr.slice(0,i+1).join('/'))}">${esc(c)}</a>`).join('')+'</div>';
  h+='<span class="b" data-b="nf">+ File</span><span class="b" data-b="nd">+ Folder</span><span class="b" data-b="up">Upload</span><div class="list">';
  if(cwd)h+=`<div class="row" data-d="${esc(cr.slice(0,-1).join('/'))}"><span>📁</span><span class="nm">..</span></div>`;
  for(const d of dirs)h+=`<div class="row" data-d="${esc(pre+d)}"><span>📁</span><span class="nm">${esc(d)}</span><span class="dots mu" data-m="d:${esc(pre+d)}">⋯</span></div>`;
  for(const[n,s]of fl)h+=`<div class="row" data-fp="${esc(pre+n)}"><span>📄</span><span class="nm">${esc(n)}</span><span class="mu">${fmt(s)}</span><span class="dots mu" data-m="f:${esc(pre+n)}">⋯</span></div>`;
  if(!dirs.length&&!fl.length)h+='<div class="row mu">Empty folder</div>';
  el.innerHTML=h+'</div>';
}
async function addNode(dir){
  const n=await ask(dir?'New folder name':'New file name');if(n==null)return;const p=(cwd?cwd+'/':'')+n;
  if(!okName(n)||!okPath(p))return toast('Invalid name');if(V.files.has(p)||V.dirs.has(p))return toast('Already exists');
  if(V.files.size+V.dirs.size>=MAXN)return toast('Too many entries');
  if(dir)V.dirs.add(p);else V.files.set(p,new Uint8Array(0));V.dirty=true;drawF();if(!dir)openEd(p);
}
async function del(ty,p){
  if(!await ask('Delete '+p+(ty==='d'?' and everything inside it?':'?'),{yn:1}))return;
  const pre=p+'/';
  if(ty==='f')V.files.delete(p);else{for(const k of[...V.files.keys()])if(k.startsWith(pre))V.files.delete(k);for(const d of[...V.dirs])if(d===p||d.startsWith(pre))V.dirs.delete(d)}
  if(E&&(E.path===p||E.path.startsWith(pre)))E=null;
  if(cwd===p||cwd.startsWith(pre))cwd=p.split('/').slice(0,-1).join('/');
  V.dirty=true;drawF();
}
async function fmenu(ty,p){
  const i=await ask(p,{items:ty==='f'?['Edit in editor','Download','Delete']:['Open folder','Delete folder']});
  if(i==null)return;
  if(ty==='d')return i===0?(cwd=p,drawF()):del('d',p);
  if(i===0)openEd(p);else if(i===1)dl(new Blob([V.files.get(p)],{type:'application/octet-stream'}),p.split('/').pop());else del('f',p);
}
$('#pf').addEventListener('click',e=>{
  const g=s=>e.target.closest(s);let x;
  if(x=g('[data-m]')){const v=x.dataset.m;return fmenu(v[0],v.slice(2))}
  if(x=g('[data-fp]'))return openEd(x.dataset.fp);
  if(x=g('[data-d]')){cwd=x.dataset.d;return drawF()}
  if(x=g('[data-b]')){const b=x.dataset.b;if(b==='up')$('#fu').click();else addNode(b==='nd')}
});
$('#fu').onchange=async e=>{
  const fs=[...e.target.files];e.target.value='';let n=0;
  for(const f of fs){
    const p=(cwd?cwd+'/':'')+f.name;
    if(!okName(f.name)||!okPath(p)||V.dirs.has(p)){toast('Skipped '+f.name+' (bad name)');continue}
    const old=V.files.get(p);if(f.size+used()-(old?old.length:0)+8+enc.encode(p).length>MAXV){toast('Skipped '+f.name+': vault would exceed 100 MB');continue}
    if(!old&&V.files.size+V.dirs.size>=MAXN)break;
    V.files.set(p,new Uint8Array(await f.arrayBuffer()));n++;
  }
  if(n){V.dirty=true;toast('Uploaded '+n+' file(s)')}drawF();
};

/* ---------- vault tab ---------- */
function setV(o){V=o;E=null;cwd='';Q.length=0;qi=0;drawV();drawF();draw()}
function drawV(){
  let h='<h3>Vault</h3>';
  if(V){const u=used();
    h+=`<div class="card2"><b>${esc(V.name)}</b> ${V.dirty?'<span class="wr">● unsaved changes</span>':''}<div class="mu">${V.files.size} files, ${V.dirs.size} folders, ${fmt(u)} of 100 MB</div><div class="bar"><i style="width:${Math.min(100,u/MAXV*100)}%"></i></div><div class="mu">AES-256-GCM, PBKDF2-SHA512 ×${V.it.toLocaleString()}</div></div>`}
  else h+='<p class="mu">No vault open. Nothing is kept on this device; contents live in memory until you save an encrypted file.</p>';
  h+='<span class="b" data-v="new">New vault</span><span class="b" data-v="open">Open vault…</span>';
  if(V)h+='<span class="b p" data-v="save">Save vault</span><span class="b" data-v="pw">Change password</span><span class="b d" data-v="lock">Lock &amp; wipe</span>';
  $('#pv').innerHTML=h+'<p class="mu">Saving writes one encrypted .hvlt file via the iOS share/download sheet. Use a long passphrase: it is the only thing protecting the vault.</p>';
}
async function newPw(label){
  const a=await ask(label+' (min 10 characters)',{secret:1});if(a==null)return null;
  if([...a].length<10){toast('Password too short');return null}
  const b=await ask('Repeat password',{secret:1});if(b!==a){toast(b==null?'Cancelled':'Passwords differ');return null}
  return a;
}
$('#pv').addEventListener('click',async e=>{
  const x=e.target.closest('[data-v]');if(!x)return;const k=x.dataset.v;
  if(k==='open')return $('#fv').click();
  if(k==='new'){
    if(V&&V.dirty&&!await ask('Discard unsaved changes in the current vault?',{yn:1}))return;
    const pw=await newPw('New password');if(pw)setV({files:new Map(),dirs:new Set(),pw,it:ITER,name:'vault',dirty:true});
  }else if(k==='pw'){const pw=await newPw('New password');if(pw){V.pw=pw;V.dirty=true;drawV();toast('Password changed. Save the vault to apply it.')}}
  else if(k==='lock'){if(V.dirty&&!await ask('Wipe vault from memory? Unsaved changes will be lost.',{yn:1}))return;setV(null)}
  else if(k==='save'){
    const n=await ask('Save as (file name)',{value:V.name});if(n==null)return;if(!okName(n))return toast('Invalid file name');
    let blob;await busy('Encrypting…');try{blob=await seal()}catch(err){toast(err.message)}await busy();
    if(!blob)return;
    if(await ask('Encrypted: '+fmt(blob.size),{items:['Download '+n+'.hvlt']})===0){dl(blob,n+'.hvlt');V.name=n;V.dirty=false;drawV();drawF()}
  }
});
$('#fv').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>MAXV+HL+16)return toast('File is larger than any valid vault');
  if(V&&V.dirty&&!await ask('Discard unsaved changes in the current vault?',{yn:1}))return;
  const buf=new Uint8Array(await f.arrayBuffer()),pw=await ask('Vault password',{secret:1});if(pw==null)return;
  await busy('Deriving key…');
  try{const r=await unseal(buf,pw);setV({...r,pw,name:f.name.replace(/\.hvlt$/i,'')||'vault',dirty:false})}catch(err){toast(err.message)}
  await busy();
};

/* ---------- shell ---------- */
function setTab(t){
  tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  document.querySelectorAll('.pg').forEach(x=>x.classList.toggle('on',x.id==='p'+t));
  if(t==='f')drawF();if(t==='v')drawV();if(t==='e')draw();updKb();
}
$('#tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)setTab(t.dataset.t)});
['copy','cut','paste','contextmenu','dragstart','selectstart'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),true));
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s&&s.rangeCount)s.removeAllRanges()});
drawV();drawF();draw();
</script></body></html>
